<section class="page-shell" [class.not-found]="isNotFound()">
  <p class="eyebrow">{{ isNotFound() ? copy().notFoundEyebrow : copy().placeholderEyebrow }}</p>
  <h1>{{ page().title }}</h1>
  <p class="lede">{{ page().description }}</p>
  <p class="page-note">{{ isNotFound() ? copy().notFoundDescription : copy().placeholderNote }}</p>

  @if (isNotFound()) {
    <a class="home-link" [routerLink]="['/', locale()]">{{ copy().backHome }}</a>
  }
</section>
