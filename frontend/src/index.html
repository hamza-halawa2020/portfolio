<!doctype html>
<html lang="en" dir="ltr" data-bs-theme="light" data-theme-preference="system">
  <head>
    <meta charset="utf-8" />
    <title>Portfolio Platform</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script src="/portfolio-public-config.js"></script>
    <script>
      (function () {
        try {
          var preference = localStorage.getItem('portfolio.theme') || 'system';
          var theme =
            preference === 'dark' ||
            (preference === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
              ? 'dark'
              : 'light';
          document.documentElement.dataset.bsTheme = theme;
          document.documentElement.dataset.themePreference = preference;
        } catch (error) {
          document.documentElement.dataset.bsTheme = 'light';
          document.documentElement.dataset.themePreference = 'system';
        }
      })();
    </script>
  </head>

  <body>
    <app-root></app-root>
  </body>
</html>
